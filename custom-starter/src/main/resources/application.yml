spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: aaa
    password: bbb
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  main:
    allow-bean-definition-overriding: true


app:
  metrics:
    time-limit: 1000
    kafka-topic: t1_demo_metrics
  datasource:
    kafka-topic: t1_demo_datasource_errors
  cache:
    time-to-live: 60
